<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BioStack: Initialize</title>
    <style>
        body { 
            margin: 0; background: #05070a; color: white; 
            font-family: -apple-system, system-ui, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; text-align: center;
        }
        .logo { font-size: 2.5rem; font-weight: 900; color: #00f2ff; letter-spacing: 4px; margin-bottom: 10px; }
        .sub { color: #8b949e; margin-bottom: 40px; font-size: 0.9rem; letter-spacing: 1px; }
        .btn { 
            width: 85%; max-width: 320px; padding: 22px; border-radius: 50px; 
            border: 2px solid #00f2ff; background: #00f2ff; color: #05070a; 
            font-weight: 900; text-transform: uppercase; cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.3);
            transition: 0.2s;
        }
        .btn:active { transform: scale(0.95); opacity: 0.8; }
    </style>
</head>
<body>
    <div class="logo">BIOSTACK</div>
    <div class="sub">HARDWARE LINK REQUIRED</div>
    
    <button class="btn" onclick="initLink()">CONNECT COOSPO</button>

    <script>
        async function initLink() {
            try {
                // Direct browser request for the Coospo
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ services: ['heart_rate'] }]
                });
                
                // If the user selects a device, set the permission flag
                sessionStorage.setItem('biostack_connected', 'true');
                
                // Jump to the main app
                window.location.href = 'index.html';
            } catch (err) {
                console.error(err);
                alert("Link Error: " + err.message + "\n\n1. Use Bluefy Browser\n2. Ensure Bluetooth is ON.");
            }
        }
    </script>
</body>
</html>
