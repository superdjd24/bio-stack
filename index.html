<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BioStack PoC-B</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #0b0e14;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --dynamic-color: hsl(180, 100%, 50%);
            --muscle-idle: #21262d;
            --recovery-blue: #58a6ff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0; padding: 15px; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        /* VIEW SYSTEM */
        .view { display: none; width: 100%; max-width: 500px; flex-direction: column; align-items: center; }
        .view.active { display: flex; }

        /* SKELETON */
        #skeleton-container { width: 100%; background: var(--panel-bg); border-radius: 24px; padding: 20px; border: 1px solid var(--border-color); margin-bottom: 20px; }
        .muscle-group { cursor: pointer; transition: fill 0.3s ease; fill: var(--muscle-idle); stroke: #30363d; stroke-width: 1.5; }
        .muscle-group:active { fill: var(--dynamic-color); }
        
        /* HUD ELEMENTS */
        .hud-card {
            background: var(--panel-bg); border: 1px solid var(--border-color);
            width: 100%; border-radius: 24px; padding: 20px; text-align: center; margin-bottom: 15px;
        }
        .big-num { font-size: 5rem; font-weight: 800; line-height: 1; margin: 10px 0; text-shadow: 0 0 15px currentColor; }
        .status-msg { font-weight: bold; letter-spacing: 1px; color: #8b949e; text-transform: uppercase; min-height: 1.2rem; }
        .recovery-mode { color: var(--recovery-blue); animation: pulse 1.5s infinite; }

        /* BUTTONS */
        .btn {
            width: 100%; padding: 18px; margin: 8px 0; border-radius: 50px;
            border: 2px solid var(--dynamic-color); background: transparent;
            color: var(--dynamic-color); font-weight: bold; text-transform: uppercase;
            font-size: 1rem; cursor: pointer; transition: 0.2s;
        }
        .btn-solid { background: var(--dynamic-color); color: var(--bg-dark); }
        .btn-back { border-color: #484f58; color: #8b949e; margin-top: 20px; }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    </style>
</head>
<body>

    <div id="view-connect" class="view active">
        <h1 style="margin-top: 30vh; letter-spacing: 4px;">BIOSTACK</h1>
        <p style="color: #8b949e; margin-bottom: 30px;">PoC Part B: Hypertrophy Engine</p>
        <button class="btn btn-solid" onclick="initBluetooth()">Initialize Coospo</button>
    </div>

    <div id="view-anatomy" class="view">
        <div class="status-msg">Select Target Muscle</div>
        <div id="skeleton-container">
            <svg id="skeleton-svg" viewBox="0 0 200 400">
                <g class="muscle-group" id="muscle-chest" onclick="selectMuscle('Chest')">
                    <path d="M70,80 Q100,70 130,80 L130,110 Q100,120 70,110 Z" />
                </g>
                <g class="muscle-group" id="muscle-biceps" onclick="selectMuscle('Biceps')">
                    <path d="M45,115 Q35,140 45,170 L60,170 Q70,140 60,115 Z" />
                    <path d="M155,115 Q165,140 155,170 L140,170 Q130,140 140,115 Z" />
                </g>
                <g class="muscle-group" id="muscle-quads" onclick="selectMuscle('Quads')">
                    <path d="M65,200 L95,200 L90,320 L60,320 Z" />
                    <path d="M105,200 L135,200 L140,320 L110,320 Z" />
                </g>
                <g class="muscle-group" id="muscle-back" onclick="selectMuscle('Back')">
                    <path d="M60,120 L140,120 L130,190 L70,190 Z" />
                </g>
                <path d="M100,20 L120,40 L120,60 L160,100 L155,180 L140,380 L60,380 L45,180 L40,100 L80,60 L80,40 Z" fill="none" stroke="#30363d" stroke-width="2" />
            </svg>
        </div>
    </div>

    <div id="view-exercises" class="view">
        <h2 id="display-muscle">Muscle</h2>
        <div id="exercise-list" style="width: 100%;"></div>
        <button class="btn btn-back" onclick="showView('view-anatomy')">Back to Skeleton</button>
    </div>

    <div id="view-training" class="view">
        <div class="hud-card">
            <div id="training-status" class="status-msg">Standby</div>
            <div id="live-hr" class="big-num">--</div>
            <div style="font-size: 0.8rem; color: #8b949e;">BPM</div>
        </div>
        
        <div id="exercise-info" style="text-align: center; margin-bottom: 20px;">
            <strong id="display-exercise">Exercise</strong><br>
            Target Max: <span id="target-max-display">--</span> BPM
        </div>

        <div id="training-controls" style="width: 100%;"></div>
        <button class="btn btn-back" onclick="exitTraining()">Change Exercise</button>
    </div>

    <script>
        const EXERCISES = {
            'Chest': ['Bench Press', 'Dumbbell Flys', 'Pushups'],
            'Biceps': ['Barbell Curls', 'Hammer Curls', 'Concentration Curls'],
            'Quads': ['Squats', 'Leg Extensions', 'Lunges'],
            'Back': ['Lat Pulldowns', 'Deadlifts', 'Bent Over Rows']
        };

        let currentMuscle = '', currentExercise = '', targetMaxHR = 0, sessionMax = 0;
        let isCalibrating = false, isTraining = false, currentBPM = 0;

        // LOCAL STORAGE
        const saveCal = (ex, val) => localStorage.setItem(`biostack_cal_${ex}`, val);
        const getCal = (ex) => localStorage.getItem(`biostack_cal_${ex}`);

        function showView(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function selectMuscle(muscle) {
            currentMuscle = muscle;
            document.getElementById('display-muscle').innerText = muscle;
            const list = document.getElementById('exercise-list');
            list.innerHTML = '';
            EXERCISES[muscle].forEach(ex => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = ex;
                btn.onclick = () => selectExercise(ex);
                list.appendChild(btn);
            });
            showView('view-exercises');
        }

        function selectExercise(ex) {
            currentExercise = ex;
            targetMaxHR = getCal(ex) || 0;
            document.getElementById('display-exercise').innerText = ex;
            document.getElementById('target-max-display').innerText = targetMaxHR || "Not Set";
            setupMainControls();
            showView('view-training');
        }

        function setupMainControls() {
            isTraining = false;
            isCalibrating = false;
            document.getElementById('training-status').innerText = "Select Mode";
            document.getElementById('training-controls').innerHTML = `
                <button class="btn" onclick="runCalibration()">Calibrate</button>
                <button class="btn btn-solid" onclick="runSet()">Begin Set 1</button>
            `;
        }

        async function initBluetooth() {
            try {
                const device = await navigator.bluetooth.requestDevice({ filters: [{ services: ['heart_rate'] }] });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService('heart_rate');
                const char = await service.getCharacteristic('heart_rate_measurement');
                await char.startNotifications();
                char.addEventListener('characteristicvaluechanged', (e) => {
                    currentBPM = e.target.value.getUint8(1);
                    document.getElementById('live-hr').innerText = currentBPM;
                    handleBiometrics();
                });
                showView('view-anatomy');
            } catch (e) { alert("Use Bluefy browser for Bluetooth support."); }
        }

        function handleBiometrics() {
            if (isCalibrating && currentBPM > sessionMax) {
                sessionMax = currentBPM;
            }

            if (isTraining && targetMaxHR > 0) {
                // Color mapping: 70 BPM (Blue) to TargetMax (Red)
                const percent = Math.min(Math.max((currentBPM - 70) / (targetMaxHR - 70), 0), 1);
                const color = `hsl(${220 - (percent * 220)}, 100%, 50%)`;
                
                const mEl = document.getElementById(`muscle-${currentMuscle.toLowerCase()}`);
                if (mEl) mEl.style.fill = color;

                const status = document.getElementById('training-status');
                if (currentBPM >= 110) {
                    status.innerText = "Rest / Recovering Mode";
                    status.classList.add('recovery-mode');
                } else {
                    status.innerText = "Muscle Primed - Start Next Set";
                    status.classList.remove('recovery-mode');
                }
            }
        }

        function runCalibration() {
            isCalibrating = true;
            sessionMax = 0;
            document.getElementById('training-status').innerText = "PUSH TO FAILURE...";
            document.getElementById('training-controls').innerHTML = `
                <button class="btn btn-solid" onclick="endCalibration()">I've Finished</button>
            `;
        }

        function endCalibration() {
            isCalibrating = false;
            saveCal(currentExercise, sessionMax);
            targetMaxHR = sessionMax;
            alert(`Calibration Saved: ${sessionMax} BPM`);
            selectExercise(currentExercise);
        }

        function runSet() {
            isTraining = true;
            document.getElementById('training-status').innerText = "Set in Progress";
            document.getElementById('training-controls').innerHTML = `
                <button class="btn btn-solid" onclick="setupMainControls()">End Set</button>
            `;
        }

        function exitTraining() {
            isTraining = false;
            const mEl = document.getElementById(`muscle-${currentMuscle.toLowerCase()}`);
            if (mEl) mEl.style.fill = '';
            showView('view-exercises');
        }
    </script>
</body>
</html>
