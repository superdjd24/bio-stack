<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BioStack Elite</title>
    <style>
        :root {
            --glow-blue: #00f2ff;
            --bg-dark: #05070a;
            --glass: rgba(10, 15, 25, 0.95);
        }

        body { margin: 0; background: var(--bg-dark); color: white; font-family: sans-serif; overflow: hidden; height: 100vh; }

        #stage {
            position: relative; width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }

        .stack-layer {
            position: absolute; height: 92%; width: auto;
            transition: opacity 0.3s ease; pointer-events: none;
        }

        #base-layer { z-index: 10; opacity: 1; }
        .muscle-overlay { z-index: 20; opacity: 0; mix-blend-mode: screen; }

        @keyframes failure-pulse {
            0% { filter: brightness(1) drop-shadow(0 0 5px #ff0044); }
            100% { filter: brightness(2) drop-shadow(0 0 25px #ff0044); }
        }
        .throbbing { animation: failure-pulse 0.3s infinite alternate; }

        #hud { position: fixed; top: 0; width: 100%; z-index: 1000; padding: 20px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; }
        .stat-pill { background: var(--glass); padding: 12px 25px; border-radius: 40px; border: 1px solid #30363d; backdrop-filter: blur(10px); }
        #hr-val { font-size: 2.5rem; font-weight: 800; color: var(--glow-blue); text-shadow: 0 0 10px var(--glow-blue); }

        #status-bar { position: fixed; top: 110px; width: 100%; text-align: center; letter-spacing: 3px; color: #8b949e; font-size: 0.7rem; text-transform: uppercase; z-index: 500; }

        /* REFINED TOUCH MAP (6x3 Grid) */
        #touch-map { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 100; display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            grid-template-rows: repeat(6, 1fr); 
        }
        .hit { pointer-events: auto; }

        .overlay { position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; background: var(--glass); border-radius: 30px; padding: 25px; border: 1px solid #30363d; backdrop-filter: blur(20px); display: none; text-align: center; z-index: 2000; }
        .overlay.visible { display: block; }
        .btn { width: 100%; padding: 18px; margin: 8px 0; border-radius: 50px; border: 2px solid var(--glow-blue); background: transparent; color: var(--glow-blue); font-weight: bold; text-transform: uppercase; cursor: pointer; }
        .btn-solid { background: var(--glow-blue); color: black; }
    </style>
</head>
<body>

    <div id="hud">
        <div class="stat-pill"><span id="hr-val">--</span></div>
        <button id="conn-btn" class="stat-pill" style="color: var(--glow-blue); cursor: pointer; border: 1px solid var(--glow-blue);">INITIALIZE SCAN</button>
    </div>

    <div id="status-bar">Biometric Link Ready</div>

    <div id="stage">
        <img src="assets/base.png" id="base-layer" class="stack-layer">

        <img src="assets/trapezoids.png" id="overlay-traps" class="muscle-overlay stack-layer">
        <img src="assets/deltoids.png" id="overlay-delts" class="muscle-overlay stack-layer">
        <img src="assets/pectorals.png" id="overlay-pecs" class="muscle-overlay stack-layer">
        <img src="assets/biceps.png" id="overlay-biceps" class="muscle-overlay stack-layer">
        <img src="assets/triceps.png" id="overlay-triceps" class="muscle-overlay stack-layer">
        <img src="assets/forearms.png" id="overlay-forearms" class="muscle-overlay stack-layer">
        <img src="assets/adbominals.png" id="overlay-abs" class="muscle-overlay stack-layer">
        <img src="assets/quads.png" id="overlay-quads" class="muscle-overlay stack-layer">

        <div id="touch-map">
            <div class="hit"></div><div class="hit" onclick="selectMuscle('Traps')"></div><div class="hit"></div>
            <div class="hit" onclick="selectMuscle('Delts')"></div><div class="hit" onclick="selectMuscle('Pecs')"></div><div class="hit" onclick="selectMuscle('Delts')"></div>
            <div class="hit" onclick="selectMuscle('Biceps')"></div><div class="hit" onclick="selectMuscle('Abs')"></div><div class="hit" onclick="selectMuscle('Biceps')"></div>
            <div class="hit" onclick="selectMuscle('Forearms')"></div><div class="hit"></div><div class="hit" onclick="selectMuscle('Forearms')"></div>
            <div class="hit" onclick="selectMuscle('Quads')"></div><div class="hit" onclick="selectMuscle('Quads')"></div><div class="hit" onclick="selectMuscle('Quads')"></div>
            <div class="hit"></div><div class="hit"></div><div class="hit"></div>
        </div>
    </div>

    <div id="menu-ex" class="overlay">
        <h2 id="musc-name" style="color: var(--glow-blue); margin-top: 0;">MUSCLE</h2>
        <div id="list-container"></div>
        <button class="btn" onclick="closeAll()" style="border:none; color:#8b949e">CLOSE</button>
    </div>

    <div id="menu-action" class="overlay">
        <h2 id="ex-name" style="margin-top: 0;">EXERCISE</h2>
        <p style="font-size: 0.8rem; color: #8b949e;">Peak HR Goal: <span id="max-bpm" style="color:white">--</span></p>
        <button class="btn" onclick="startCalibration()">CALIBRATE FAILURE</button>
        <button class="btn btn-solid" onclick="startTraining()">BEGIN SET</button>
        <button class="btn" onclick="closeAll()" style="border:none; color:#8b949e">CANCEL</button>
    </div>

    <script src="js/biostack.js"></script>
</body>
</html>
