<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BioStack Elite v2.0</title>
    <style>
        :root {
            --glow-blue: #00f2ff;
            --glow-red: #ff0044;
            --bg-dark: #05070a;
            --glass: rgba(10, 15, 25, 0.95);
        }

        body { 
            margin: 0; 
            background: var(--bg-dark); 
            color: white; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            overflow: hidden; 
            height: 100vh; 
        }

        /* THE STACK CONTAINER */
        #stage {
            position: relative; 
            width: 100vw; 
            height: 100vh;
            display: flex; 
            justify-content: center; 
            align-items: center;
            background: radial-gradient(circle at center, #111a24 0%, #05070a 100%);
        }

        .stack-layer {
            position: absolute; 
            height: 92%; 
            width: auto;
            transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            pointer-events: none;
        }

        #base-layer { z-index: 10; opacity: 1; }
        
        .muscle-overlay { 
            z-index: 20; 
            opacity: 0; 
            mix-blend-mode: screen; 
            filter: brightness(1.2) drop-shadow(0 0 10px rgba(255, 0, 68, 0.2));
        }

        /* PULSE ANIMATION FOR PEAK EFFORT */
        @keyframes failure-pulse {
            0% { filter: brightness(1.2) drop-shadow(0 0 5px var(--glow-red)); }
            100% { filter: brightness(2.2) drop-shadow(0 0 30px var(--glow-red)); }
        }
        .throbbing { animation: failure-pulse 0.3s infinite alternate; }

        /* HUD & TELEMETRY */
        #hud { 
            position: fixed; 
            top: 0; 
            width: 100%; 
            z-index: 1000; 
            padding: 20px; 
            box-sizing: border-box; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding-top: env(safe-area-inset-top);
        }
        
        .stat-pill { 
            background: var(--glass); 
            padding: 12px 25px; 
            border-radius: 40px; 
            border: 1px solid #30363d; 
            backdrop-filter: blur(15px); 
            box-shadow: 0 4px 24px rgba(0,0,0,0.5);
        }
        
        #hr-val { font-size: 2.5rem; font-weight: 800; color: var(--glow-blue); text-shadow: 0 0 15px var(--glow-blue); }

        #status-bar { 
            position: fixed; 
            top: 130px; 
            width: 100%; 
            text-align: center; 
            letter-spacing: 4px; 
            color: #8b949e; 
            font-size: 0.7rem; 
            text-transform: uppercase; 
            z-index: 500; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* THE INVISIBLE TOUCH GRID (Mapped to Skeleton) */
        #touch-map { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 100; 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            grid-template-rows: repeat(6, 1fr); 
        }
        .hit { pointer-events: auto; }

        /* MODAL OVERLAYS */
        .overlay { 
            position: fixed; 
            bottom: 50px; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 92%; 
            max-width: 400px; 
            background: var(--glass); 
            border-radius: 35px; 
            padding: 30px; 
            border: 1px solid #30363d; 
            backdrop-filter: blur(25px); 
            display: none; 
            text-align: center; 
            z-index: 2000;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        
        .overlay.visible { display: block; animation: slideUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        @keyframes slideUp {
            from { transform: translate(-50%, 100%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

        .btn { 
            width: 100%; 
            padding: 20px; 
            margin: 10px 0; 
            border-radius: 50px; 
            border: 2px solid var(--glow-blue); 
            background: transparent; 
            color: var(--glow-blue); 
            font-weight: 800; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            cursor: pointer; 
            transition: 0.2s;
        }
        
        .btn:active { transform: scale(0.96); background: var(--glow-blue); color: #05070a; }
        .btn-solid { background: var(--glow-blue); color: #05070a; }
        .btn-close { border: none; color: #8b949e; font-size: 0.8rem; margin-top: 10px; }

    </style>
</head>
<body>

    <div id="hud">
        <div class="stat-pill"><span id="hr-val">--</span> <span style="font-size:0.8rem; opacity:0.6">BPM</span></div>
        <button id="conn-btn" class="stat-pill" style="color: var(--glow-blue); font-weight: bold; cursor: pointer;">INITIALIZE LINK</button>
    </div>

    <div id="status-bar">Syncing Biometric Stream...</div>

    <div id="stage">
        <img src="assets/base.png" id="base-layer" class="stack-layer">

        <img src="assets/trapezoids.png" id="overlay-trapezoids" class="muscle-overlay stack-layer">
        <img src="assets/deltoids.png" id="overlay-deltoids" class="muscle-overlay stack-layer">
        <img src="assets/pectorals.png" id="overlay-pectorals" class="muscle-overlay stack-layer">
        <img src="assets/biceps.png" id="overlay-biceps" class="muscle-overlay stack-layer">
        <img src="assets/triceps.png" id="overlay-triceps" class="muscle-overlay stack-layer">
        <img src="assets/forearms.png" id="overlay-forearms" class="muscle-overlay stack-layer">
        <img src="assets/abdominals.png" id="overlay-abdominals" class="muscle-overlay stack-layer">
        <img src="assets/quads.png" id="overlay-quads" class="muscle-overlay stack-layer">

        <div id="touch-map">
            <div class="hit"></div><div class="hit" onclick="selectMuscle('Trapezoids')"></div><div class="hit"></div>
            <div class="hit" onclick="selectMuscle('Deltoids')"></div><div class="hit" onclick="selectMuscle('Pectorals')"></div><div class="hit" onclick="selectMuscle('Deltoids')"></div>
            <div class="hit" onclick="selectMuscle('Biceps')"></div><div class="hit" onclick="selectMuscle('Abdominals')"></div><div class="hit" onclick="selectMuscle('Biceps')"></div>
            <div class="hit" onclick="selectMuscle('Forearms')"></div><div class="hit"></div><div class="hit" onclick="selectMuscle('Triceps')"></div>
            <div class="hit" onclick="selectMuscle('Quads')"></div><div class="hit" onclick="selectMuscle('Quads')"></div><div class="hit" onclick="selectMuscle('Quads')"></div>
            <div class="hit"></div><div class="hit"></div><div class="hit"></div>
        </div>
    </div>

    <div id="menu-ex" class="overlay">
        <h2 id="musc-name" style="color: var(--glow-blue); margin-top: 0; letter-spacing: 2px;">MUSCLE</h2>
        <div id="list-container"></div>
        <button class="btn btn-close" onclick="closeAll()">CANCEL SCAN</button>
    </div>

    <div id="menu-action" class="overlay">
        <h2 id="ex-name" style="margin-top: 0; letter-spacing: 1px;">EXERCISE</h2>
        <p style="font-size: 0.9rem; color: #8b949e; margin-bottom: 25px;">Stored Peak HR: <span id="max-bpm" style="color:white; font-weight:bold">--</span></p>
        <button class="btn" onclick="startCalibration()">CALIBRATE PEAK</button>
        <button class="btn btn-solid" onclick="startTraining()">BEGIN TRAINING SET</button>
        <button class="btn btn-close" onclick="closeAll()">EXIT</button>
    </div>

    <script src="js/biostack.js"></script>
</body>
</html>
