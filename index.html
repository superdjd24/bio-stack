<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BioStack 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; background: #05070a; overflow: hidden; }
        #ui { position: absolute; top: 20px; width: 100%; text-align: center; color: #00f2ff; font-family: sans-serif; pointer-events: none; }
        #connect-btn { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); padding: 15px 30px; border: 2px solid #00f2ff; background: transparent; color: #00f2ff; border-radius: 50px; cursor: pointer; pointer-events: auto; }
    </style>
</head>
<body>
    <div id="ui"><h3>BIOSTACK 3D ENGINE</h3><p id="status">INITIALIZING...</p></div>
    <button id="connect-btn" onclick="initBluetooth()">CONNECT COOSPO</button>
    <script src="js/biostack.js"></script>
</body>
</html>
