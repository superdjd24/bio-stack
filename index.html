<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BioStack 3D Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --glow-blue: #00f2ff;
            --glass-bg: rgba(10, 15, 20, 0.9);
            --border: #30363d;
        }

        body { margin: 0; background: #05070a; color: white; font-family: sans-serif; overflow: hidden; }

        /* THE HUD LAYER */
        #hud-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 100; padding: 20px; box-sizing: border-box;
        }
        
        /* Force all buttons to be clickable */
        .interactive { pointer-events: auto !important; cursor: pointer; }

        .hud-header { display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
        .stat-pill { 
            background: var(--glass-bg); padding: 12px 25px; border-radius: 40px; 
            border: 1px solid var(--border); backdrop-filter: blur(10px);
        }
        #hr-display { font-size: 2.5rem; font-weight: 800; color: var(--glow-blue); line-height: 1; }

        #status-msg { 
            position: absolute; top: 120px; width: 100%; text-align: center; 
            font-weight: bold; text-transform: uppercase; letter-spacing: 3px; color: #8b949e;
        }

        /* OVERLAYS */
        .overlay {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; background: var(--glass-bg); 
            border-radius: 30px; padding: 25px; border: 1px solid var(--border);
            backdrop-filter: blur(20px); display: none; text-align: center;
            pointer-events: auto; /* Ensure menu content is clickable */
        }
        .overlay.active { display: block; }

        .btn {
            width: 100%; padding: 18px; margin: 8px 0; border-radius: 50px;
            border: 2px solid var(--glow-blue); background: transparent;
            color: var(--glow-blue); font-weight: bold; text-transform: uppercase;
            font-size: 0.9rem; transition: 0.2s;
        }
        .btn:active { transform: scale(0.95); background: var(--glow-blue); color: black; }
        .btn-solid { background: var(--glow-blue); color: #05070a; }
        .btn-back { border-color: #484f58; color: #8b949e; margin-top: 15px; }
    </style>
</head>
<body>

    <div id="hud-layer">
        <div class="hud-header">
            <div class="stat-pill"><div id="hr-display">--</div></div>
            <button id="connect-btn" class="stat-pill interactive" style="color: var(--glow-blue); font-weight: bold;">CONNECT</button>
        </div>

        <div id="status-msg">SCANNING BODY...</div>

        <div id="exercise-menu" class="overlay">
            <h2 id="menu-muscle-title" style="margin-top: 0; color: var(--glow-blue);">MUSCLE</h2>
            <div id="exercise-container"></div>
            <button class="btn btn-back interactive" onclick="hideAllOverlays()">BACK TO SCAN</button>
        </div>

        <div id="action-menu" class="overlay">
            <h2 id="menu-exercise-title" style="margin-top: 0;">EXERCISE</h2>
            <p style="font-size: 0.8rem; color: #8b949e;">Target Max: <span id="target-max-val" style="color:white">--</span> BPM</p>
            <button class="btn interactive" onclick="startCalibration()">CALIBRATE</button>
            <button class="btn btn-solid interactive" onclick="startTrainingSet()">BEGIN SET 1</button>
            <button class="btn btn-back interactive" onclick="showExerciseMenu()">BACK</button>
        </div>
    </div>

    <script src="js/biostack.js"></script>

    <script>
        const EXERCISES_DB = {
            'Chest': ['Bench Press', 'Dumbbell Flys'],
            'Biceps': ['Barbell Curls', 'Hammer Curls'],
            'Quads': ['Squats', 'Leg Extensions'],
            'Back': ['Lat Pulldowns', 'Deadlifts']
        };

        window.openMuscleMenu = function(muscleName) {
            document.getElementById('menu-muscle-title').innerText = muscleName;
            const container = document.getElementById('exercise-container');
            container.innerHTML = "";
            EXERCISES_DB[muscleName].forEach(ex => {
                const b = document.createElement('button');
                b.className = "btn interactive";
                b.innerText = ex;
                b.onclick = () => openActionMenu(ex);
                container.appendChild(b);
            });
            hideAllOverlays();
            document.getElementById('exercise-menu').classList.add('active');
        };

        function openActionMenu(ex) {
            currentExercise = ex; 
            document.getElementById('menu-exercise-title').innerText = ex;
            const savedMax = localStorage.getItem('biostack_max_' + ex) || "--";
            document.getElementById('target-max-val').innerText = savedMax;
            targetMaxHR = parseInt(savedMax) || 0;
            hideAllOverlays();
            document.getElementById('action-menu').classList.add('active');
        }

        function hideAllOverlays() {
            document.querySelectorAll('.overlay').forEach(o => o.classList.remove('active'));
            document.getElementById('status-msg').innerText = "SCANNING BODY...";
            isTraining = false; isCalibrating = false;
        }

        function showExerciseMenu() {
            hideAllOverlays();
            document.getElementById('exercise-menu').classList.add('active');
        }

        function startCalibration() {
            hideAllOverlays(); isCalibrating = true; sessionMax = 0;
            document.getElementById('status-msg').innerText = "PUSH TO FAILURE...";
            // Logic for a floating "Finish" button goes here if needed
        }

        function startTrainingSet() {
            hideAllOverlays(); isTraining = true;
            document.getElementById('status-msg').innerText = "SET IN PROGRESS";
        }

        document.getElementById('connect-btn').onclick = () => {
            if (typeof initBluetooth === "function") initBluetooth();
            document.getElementById('connect-btn').style.display = "none";
        };
    </script>
</body>
</html>
