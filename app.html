<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        if (sessionStorage.getItem('biostack_paired') !== 'true') {
            window.location.href = 'index.html';
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BioStack Elite v6.4</title>
    <style>
        :root { --glow-blue: #00f2ff; --bg-dark: #05070a; --glass: rgba(15, 20, 30, 0.95); --border: #30363d; }
        body { margin: 0; background: var(--bg-dark); color: white; font-family: -apple-system, system-ui, sans-serif; overflow: hidden; height: 100vh; }
        #top-dash { position: fixed; top: 0; width: 100%; height: 100px; display: flex; align-items: center; justify-content: space-between; padding: 20px; box-sizing: border-box; z-index: 1000; }
        #tel-group { display: flex; align-items: center; gap: 12px; }
        #hr-pill { background: var(--glass); width: 110px; height: 60px; border-radius: 50px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; }
        #hr-val { font-size: 2.2rem; font-weight: 900; color: var(--glow-blue); text-shadow: 0 0 10px rgba(0, 242, 255, 0.5); }
        #hr-icon { width: 24px; height: auto; filter: drop-shadow(0 0 5px var(--glow-blue)); }
        #graph-box { width: 220px; height: 45px; position: relative; overflow: visible; }
        #sparkline-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #mid-dash { position: fixed; top: 110px; left: 20px; z-index: 900; }
        #cal-box { font-size: 1.1rem; font-weight: 700; opacity: 0.8; }
        #musc-header { font-size: 0.8rem; margin-top: 10px; color: var(--glow-blue); letter-spacing: 1px; }
        #sidebar { position: fixed; top: 200px; left: 20px; width: 140px; height: 50vh; z-index: 500; overflow-y: auto; }
        .list-btn { width: 100%; padding: 12px; margin-bottom: 8px; border-radius: 12px; border: 1px solid var(--border); background: var(--glass); color: white; font-size: 0.7rem; text-align: left; text-transform: uppercase; font-weight: 600; }
        #version-tag { position: fixed; bottom: 15px; left: 15px; font-size: 0.6rem; color: #333; z-index: 1000; letter-spacing: 1px; }
        #stage-area { position: fixed; top: 120px; right: 0; width: 45vw; height: 65vh; display: flex; justify-content: flex-end; z-index: 10; }
        #image-container { position: relative; height: 100%; width: auto; display: inline-block; }
        #base-front { height: 100%; width: auto; display: block; opacity: 1; }
        .stack-layer { position: absolute; top: 0; right: 0; height: 100%; width: auto; pointer-events: none; transition: opacity 0.4s ease; display: none; }
        .layer-visible { display: block; }
        .muscle-overlay { z-index: 12; opacity: 0; mix-blend-mode: screen; }
        .ui-overlay { z-index: 15; opacity: 1; pointer-events: none; }
        #touch-map { position: absolute; top: 0; right: 0; width: 100%; height: 100%; z-index: 2000; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(6, 1fr); }
        .hit { width: 100%; height: 100%; pointer-events: auto; outline: none; }
        .overlay { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 400px; background: var(--glass); border-radius: 35px; padding: 30px; border: 1px solid var(--border); backdrop-filter: blur(25px); display: none; text-align: center; z-index: 3000; }
        .btn-modal { width: 100%; padding: 18px; background: var(--glow-blue); color: black; border-radius: 50px; font-weight: 800; border: none; text-transform: uppercase; }
        .visible { display: block !important; }
    </style>
</head>
<body>
    <div id="version-tag">BIOSTACK_v6.4_ARM_RECOVERY</div>
    <div id="top-dash">
        <div id="tel-group">
            <div id="hr-pill" onclick="startStream()">
                <span id="hr-val">LINK</span>
            </div>
            <img src="assets/heartbeat_icon.png" id="hr-icon">
        </div>
        <div id="graph-box">
            <canvas id="sparkline-canvas"></canvas>
        </div>
    </div>
    <div id="mid-dash">
        <div id="cal-box"><span id="total-cal">0</span> <span style="font-size:0.7rem; opacity:0.5;">cal</span></div>
        <div id="musc-header">TARGET: --</div>
    </div>
    <div id="sidebar"><div id="exercise-picker"></div></div>
    <div id="stage-area">
        <div id="image-container">
            <img src="assets/base_front.png" id="base-front">
            <img src="assets/back_button.png" id="btn-to-back" class="stack-layer ui-overlay layer-visible">
            <img src="assets/front_button.png" id="btn-to-front" class="stack-layer ui-overlay">
            
            <img src="assets/trapezoids.png" id="overlay-trapezoids" class="muscle-overlay stack-layer layer-visible">
            <img src="assets/deltoids.png" id="overlay-deltoids" class="muscle-overlay stack-layer layer-visible">
            <img src="assets/pectorals.png" id="overlay-pectorals" class="muscle-overlay stack-layer layer-visible">
            <img src="assets/biceps.png" id="overlay-biceps" class="muscle-overlay stack-layer layer-visible">
            <img src="assets/forearms.png" id="overlay-forearms" class="muscle-overlay stack-layer layer-visible">
            <img src="assets/abdominals.png" id="overlay-abdominals" class="muscle-overlay stack-layer layer-visible">
            <img src="assets/quads.png" id="overlay-quads" class="muscle-overlay stack-layer layer-visible">
            
            <img src="assets/base_back.png" id="base-back" class="stack-layer" style="z-index: 11;">
            <img src="assets/lats.png" id="overlay-lats" class="muscle-overlay stack-layer">
            <img src="assets/triceps.png" id="overlay-triceps" class="muscle-overlay stack-layer">
            <img src="assets/glutes.png" id="overlay-glutes" class="muscle-overlay stack-layer">
            <img src="assets/hamstrings.png" id="overlay-hamstrings" class="muscle-overlay stack-layer">
            <img src="assets/calves.png" id="overlay-calves" class="muscle-overlay stack-layer">
            <div id="touch-map"></div>
        </div>
    </div>
    <div id="menu-action" class="overlay">
        <h2 id="ex-name-modal" style="margin-bottom: 25px;">EXERCISE</h2>
        <button class="btn-modal" onclick="startTraining()">START SETS</button>
        <p onclick="closeAction()" style="margin-top:20px; font-size:0.8rem; opacity:0.5; cursor: pointer;">CANCEL</p>
    </div>
    <script src="js/biostack.js"></script>
</body>
</html>
