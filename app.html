<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BioStack Elite v6.9</title>
    <style>
        :root { --glow-blue: #00f2ff; --bg-dark: #05070a; --glass: rgba(15, 20, 30, 0.95); --border: #30363d; }
        body { margin: 0; background: var(--bg-dark); color: white; font-family: -apple-system, system-ui, sans-serif; overflow: hidden; height: 100vh; }
        
        /* LOGIN OVERLAY */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-dark); z-index: 10000;
            display: flex; align-items: center; justify-content: center;
        }
        .login-card { background: var(--glass); padding: 40px; border-radius: 30px; border: 1px solid var(--border); text-align: center; width: 85%; max-width: 400px; }
        input { width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 12px; border: 1px solid #444; background: #000; color: #fff; box-sizing: border-box; }

        /* DASHBOARD (Hidden by default) */
        #main-dashboard { display: none; opacity: 0; transition: opacity 0.5s ease; }

        /* Standard Dashboard CSS below... */
        #top-dash { position: fixed; top: 0; width: 100%; height: 100px; display: flex; align-items: center; justify-content: space-between; padding: 20px; box-sizing: border-box; z-index: 9000; }
        #tel-group { display: flex; align-items: center; gap: 12px; }
        #hr-pill { background: var(--glass); width: 110px; height: 60px; border-radius: 50px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; }
        #hr-val { font-size: 2.2rem; font-weight: 900; color: var(--glow-blue); }
        #graph-box { width: 220px; height: 45px; position: relative; }
        #sparkline-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #mid-dash { position: fixed; top: 110px; left: 20px; }
        #total-cal { color: var(--glow-blue); font-size: 1.4rem; font-weight: 700; }
        #sidebar { position: fixed; top: 200px; left: 20px; width: 140px; }
        .list-btn { width: 100%; padding: 12px; margin-bottom: 8px; border-radius: 12px; border: 1px solid var(--border); background: var(--glass); color: white; font-size: 0.7rem; text-align: left; text-transform: uppercase; }
        #stage-area { position: fixed; top: 120px; right: 0; width: 45vw; height: 65vh; display: flex; justify-content: flex-end; }
        #image-container { position: relative; height: 100%; width: auto; display: inline-block; }
        #base-front { height: 100%; width: auto; }
        .stack-layer { position: absolute; top: 0; right: 0; height: 100%; width: auto; pointer-events: none; display: none; }
        .layer-visible { display: block; }
        .muscle-overlay { z-index: 12; opacity: 0; mix-blend-mode: screen; }
        #touch-map { position: absolute; top: 0; right: 10%; width: 80%; height: 100%; z-index: 2000; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(6, 1fr); }
        .hit { width: 100%; height: 100%; pointer-events: auto; }
        .overlay { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 400px; background: var(--glass); border-radius: 35px; padding: 30px; border: 1px solid var(--border); display: none; text-align: center; z-index: 9500; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <h2 style="color: var(--glow-blue);">BIOSTACK LOGIN</h2>
            <input type="number" id="user-weight" placeholder="Weight (lbs)">
            <input type="number" id="user-height" placeholder="Height (in)">
            <input type="number" id="user-age" placeholder="Age">
            <button onclick="initSystem()" style="width: 100%; padding: 18px; background: var(--glow-blue); border-radius: 50px; font-weight: 800; border: none; cursor: pointer;">INITIALIZE & LINK</button>
        </div>
    </div>

    <div id="main-dashboard">
        <div id="top-dash">
            <div id="tel-group">
                <div id="hr-pill"><span id="hr-val">--</span></div>
                <img src="assets/heartbeat_icon.png" style="width:24px;">
            </div>
            <div id="graph-box"><canvas id="sparkline-canvas"></canvas></div>
        </div>

        <div id="mid-dash">
            <div><span id="total-cal">0</span> <span style="font-size:0.7rem; opacity:0.5;">CALORIES</span></div>
            <div id="musc-header" style="color:var(--glow-blue); font-size:0.8rem; margin-top:10px;">TARGET: --</div>
        </div>

        <div id="sidebar"><div id="exercise-picker"></div></div>

        <div id="stage-area">
            <div id="image-container">
                <img src="assets/base_front.png" id="base-front">
                <img src="assets/back_button.png" id="btn-to-back" class="stack-layer layer-visible" style="z-index:20;">
                <img src="assets/front_button.png" id="btn-to-front" class="stack-layer" style="z-index:20;">
                
                <img src="assets/trapezoids.png" id="overlay-trapezoids" class="muscle-overlay stack-layer layer-visible">
                <img src="assets/deltoids.png" id="overlay-deltoids" class="muscle-overlay stack-layer layer-visible">
                <img src="assets/pectorals.png" id="overlay-pectorals" class="muscle-overlay stack-layer layer-visible">
                <img src="assets/biceps.png" id="overlay-biceps" class="muscle-overlay stack-layer layer-visible">
                <img src="assets/abdominals.png" id="overlay-abdominals" class="muscle-overlay stack-layer layer-visible">
                <img src="assets/quads.png" id="overlay-quads" class="muscle-overlay stack-layer layer-visible">
                
                <img src="assets/base_back.png" id="base-back" class="stack-layer" style="z-index: 11;">
                <img src="assets/lats.png" id="overlay-lats" class="muscle-overlay stack-layer">
                <img src="assets/triceps.png" id="overlay-triceps" class="muscle-overlay stack-layer">
                <img src="assets/glutes.png" id="overlay-glutes" class="muscle-overlay stack-layer">
                <img src="assets/hamstrings.png" id="overlay-hamstrings" class="muscle-overlay stack-layer">
                <img src="assets/calves.png" id="overlay-calves" class="muscle-overlay stack-layer">

                <div id="touch-map"></div>
            </div>
        </div>

        <div id="menu-action" class="overlay">
            <h2 id="ex-name-modal">EXERCISE</h2>
            <button onclick="startTraining()" style="width:100%; padding:18px; background:var(--glow-blue); border-radius:50px; font-weight:800; border:none;">START SETS</button>
        </div>
    </div>

    <script src="js/biostack.js"></script>
</body>
</html>
