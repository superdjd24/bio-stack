<script>
async function saveAndGo() {
    const w = document.getElementById('user-weight').value;
    const h = document.getElementById('user-height').value;
    const a = document.getElementById('user-age').value;
    
    if(!w || !h || !a) {
        alert("Weight, Height, and Age are required.");
        return;
    }

    try {
        // ACTUAL BLE INITIALIZATION
        const device = await navigator.bluetooth.requestDevice({ 
            filters: [{ services: ['heart_rate'] }] 
        });
        
        // Save Biometrics
        localStorage.setItem('bio_weight', w);
        localStorage.setItem('bio_height', h);
        localStorage.setItem('bio_age', a);
        
        // Flag that we are paired and ready
        sessionStorage.setItem('biostack_paired', 'true');
        
        // Redirect to App
        window.location.href = 'app.html';
        
    } catch (e) {
        alert("Bluetooth Setup Cancelled or Failed: " + e.message);
    }
}
</script>
